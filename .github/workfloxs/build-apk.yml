name: Build Versalis GN APK

on:
  push:
  workflow_dispatch:

env:
  # >>> THE ONLY LINE YOU NEED TO EDIT: put your own Netlify link between the quotes <<<
  APP_URL: "wonderful-quokka-a889e1.netlify.app"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the app files
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
            echo "Using index.html from the repository"
          else
            echo "Downloading the app from $APP_URL"
            curl -fsSL "$APP_URL" -o www/index.html || { echo "ERROR: could not download the app. Check the APP_URL line at the top of this file."; exit 1; }
          fi
          grep -q "Versalis" www/index.html || { echo "ERROR: that page is not Versalis GN. Check the APP_URL line at the top of this file."; exit 1; }

      - name: Create the Android project settings
        run: |
          cat > package.json <<'JSON'
          {"name":"versalis-gn","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.0.0","@capacitor/cli":"^6.0.0","@capacitor/core":"^6.0.0","@capacitor/geolocation":"^6.0.0","@capacitor/network":"^6.0.0"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"app.versalis.gn","appName":"Versalis GN","webDir":"www","backgroundColor":"#000000","server":{"androidScheme":"https"},"android":{"backgroundColor":"#000000"}}
          JSON

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Full screen (hides the Android system bars)
        run: |
          cat > android/app/src/main/java/app/versalis/gn/MainActivity.java <<'JAVA'
          package app.versalis.gn;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideBars();
            }
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              if (Build.VERSION.SDK_INT >= 28) {
                getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          JAVA

      - name: Globe app icon (skipped automatically if anything is different)
        continue-on-error: true
        run: |
          pip install pillow
          python - <<'PY'
          import glob
          from PIL import Image, ImageDraw
          for f in glob.glob('android/app/src/main/res/mipmap-*/ic_launcher*.png'):
              w, h = Image.open(f).size
              fg = 'foreground' in f
              im = Image.new('RGBA', (w, h), (0, 0, 0, 0) if fg else (0, 0, 0, 255))
              d = ImageDraw.Draw(im)
              c = w / 2
              r = w * (0.26 if fg else 0.34)
              lw = max(2, int(w / 40))
              col = (77, 163, 255, 255)
              d.ellipse([c - r, c - r, c + r, c + r], outline=col, width=lw)
              for k in (0.35, 0.7):
                  d.ellipse([c - r * k, c - r, c + r * k, c + r], outline=col, width=max(1, lw // 2))
              d.line([c - r, c, c + r, c], fill=col, width=max(1, lw // 2))
              if 'round' in f and not fg:
                  m = Image.new('L', (w, h), 0)
                  ImageDraw.Draw(m).ellipse([0, 0, w, h], fill=255)
                  im.putalpha(m)
              im.save(f)
          PY
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#000000</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml

      - name: Build the APK
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk VersalisGN.apk

      - name: Publish the APK on the Releases page (easy download)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: Versalis GN (latest build)
          body: Tap VersalisGN.apk below to download the newest build.
          files: VersalisGN.apk

      - name: Also keep a copy under the run (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: VersalisGN-apk
          path: VersalisGN.apk
